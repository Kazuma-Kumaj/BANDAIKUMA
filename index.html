<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <!-- Thêm dòng này để liên kết file style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1 id="title">Xin chào thế giới!</h1>
        <p>Số lượt bạn đã bấm nút: <strong id="counter-val">0</strong></p>
        
        <button id="btn-count">Bấm vào đây</button>
        <button id="btn-theme" class="btn-secondary">Đổi chế độ Tối</button>
        <!-- Thêm nút Reset ở đây -->
        <button id="btn-reset" class="btn-danger">Đặt lại (Reset)</button>
    </div>

    <!-- Kết nối file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
