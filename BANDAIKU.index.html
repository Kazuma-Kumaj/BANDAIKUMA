<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa thông tin thành viên</title>
    <link rel="stylesheet" href="BANDAIKU.style.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <span class="badge">b62</span>
        <span class="badge">1c157d10</span>
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <span class="toggle-label">Tắt</span>
        </div>
        <span class="close-btn">&times;</span>
    </div>

    <div class="container">
        <div class="acc-info">Acc (member_id): 1210394</div>

        <!-- Alert Box -->
        <div class="alert-box">
            <span class="alert-icon">🔧</span>
            <span>Vui lòng kiểm tra lại server...</span>
        </div>

        <!-- Section 1: Thông tin thành viên -->
        <div class="section-title">
            👤 Thông tin thành viên (マイページ)
        </div>

        <div class="form-group">
            <label>Họ tên ( TRAN VAN A )</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Họ tên (Katakana)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Nickname (ニックネーム)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Ngày sinh (生年月日)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Giới tính (性別)</label>
            <div class="select-wrapper">
                <select>
                    <option value="">— giữ nguyên —</option>
                    <option value="male">Nam</option>
                    <option value="female">Nữ</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Email (メールアドレス)</label>
            <input type="email" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Số điện thoại (電話番号)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Mã bưu điện 〒 (郵便番号)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Tỉnh (都道府県)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Thành phố/Quận (市区町村)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Địa chỉ (丁目・番地)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Tòa nhà / phòng (ビル・マンション名・部屋番号)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Point</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>member_id hiển thị</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="divider"></div>

        <!-- Section 2: Vé vào cửa -->
        <div class="section-title">
            🎫 Vé vào cửa (入場チケット)
        </div>

        <div class="form-group">
            <label>SP</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Tên cơ sở / 店舗</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Ngày + giờ tập trung</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Số 整理券番号</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Mã đơn (EC-...)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>Địa chỉ 店舗住所 (nhiều dòng)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="divider"></div>

        <!-- Section 3: Lịch sử mua -->
        <div class="section-title">
            📜 Lịch sử mua (購入履歴) — chỉ đơn mới nhất
        </div>

        <div class="form-group">
            <label>📜 1. Trạng thái (当選/落選...)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>📜 2. Ngày đặt đơn 注文日時 (vd 2026年07月21日 21時00分)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>📜 3. Mã đơn (EC-...)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>📜 4. Tên tiệm 【...】 (vd 東京新宿店)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>📜 5. Ngày trong tên SP (vd 7/4・5)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <div class="form-group">
            <label>📜 6. Slot cuối tên SP (vd (7/4(土) 集合時間16:00) — có hoặc)</label>
            <input type="text" placeholder="— giữ nguyên —">
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn btn-submit">Lưu tất cả</button>
            <button class="btn btn-reset">Reset info thật</button>
        </div>

        <!-- Footer note -->
        <div class="footer-note">
            Chỉ đổi hiển thị cục bộ — không đổi data server. Không dùng ảnh để qua mặt KYC / bán acc / khiếu nại.
        </div>
    </div>
        <!-- THÊM DÒNG NÀY Ở CỦOI FILE HTML -->
    <script src="BANDAIKU.script.js"></script>
</body>
</html>
